<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard Menfess @indofess</title><style>body{font-family:sans-serif;max-width:700px;margin:auto;padding:20px;background:#fff5f8} .card{background:#fff;border:1px solid #ffd6e0;border-radius:12px;padding:14px;margin:12px 0} button{padding:8px 14px;border:none;border-radius:8px;cursor:pointer} .acc{background:#22c55e;color:#fff} .tolak{background:#ef4444;color:#fff} input{padding:10px;width:100%;border-radius:8px;border:1px solid #ddd}</style></head>
<body><h2>💌 Dashboard Menfess @indofess</h2><input id="key" placeholder="Masukkan ADMIN_KEY" type="password"><button onclick="load()">Lihat Menfess</button><div id="list"></div>
<script>
async function load(){
  const key=document.getElementById('key').value;
  const r=await fetch('/api/menfess',{headers:{'x-admin-key':key}});
  const data=await r.json();
  document.getElementById('list').innerHTML=data.map(m=>`<div class="card"><b>#${m.id} @${m.username||'anon'}</b> - ${m.status}<p>${m.content||'[foto/video]'}</p><button class="acc" onclick="act(${m.id},'acc')">ACC</button> <button class="tolak" onclick="act(${m.id},'tolak')">Tolak</button></div>`).join('');
}
